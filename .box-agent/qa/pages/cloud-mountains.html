<h1>云山</h1>
<p>道可道，非常道；名可名，非常名。无名天地之始，有名万物之母。故常无欲以观其妙，常有欲以观其徼。此两者同出而异名，同谓之玄，玄之又玄，众妙之门。</p>
<p>天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教。</p>
<blockquote>万物作焉而不辞，生而不有，为而不恃，功成而弗居。夫唯弗居，是以不去。<br>—— 行内代码示例：<code>npm run dev</code></blockquote>
<p>不尚贤，使民不争；不贵难得之货，使民不为盗；不见可欲，使民心不乱。是以圣人之治，虚其心，实其腹，弱其志，强其骨。</p>
